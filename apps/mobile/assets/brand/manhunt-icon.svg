<?xml version="1.0" encoding="UTF-8"?>
<!--
  Manhunt app icon: the source of truth for every icon, splash and logo image.
  After editing, run `pnpm --filter @manhunt/mobile icons`.

  scripts/generate-icons.mjs splits the drawing at the `layer:` comments,
  so keep them: Android's adaptive icon needs the backdrop and the artwork
  as separate layers.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Hooded figure with red eyes inside a crosshair">
<defs>
<radialGradient id="a-bg" cx="50%" cy="46%" r="70%">
<stop offset="0%" stop-color="#3a070b"/>
<stop offset="45%" stop-color="#14030a"/>
<stop offset="100%" stop-color="#030303"/>
</radialGradient>
<filter id="a-aura" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
<filter id="a-glow" x="-200%" y="-400%" width="500%" height="900%">
<feGaussianBlur stdDeviation="7" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="a-rim" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ff2b2b" stop-opacity="0.9"/>
<stop offset="60%" stop-color="#ff2b2b" stop-opacity="0.15"/>
<stop offset="100%" stop-color="#ff2b2b" stop-opacity="0"/>
</linearGradient>
<pattern id="a-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.05"/></pattern>
<radialGradient id="a-vig" cx="50%" cy="50%" r="72%">
<stop offset="60%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
</radialGradient>
</defs>
<!-- layer:backdrop -->
<rect width="512" height="512" fill="url(#a-bg)"/>
<!-- /layer:backdrop -->
<!-- layer:artwork -->
<circle cx="256" cy="220" r="150" fill="#ff2b2b" opacity="0.45" filter="url(#a-aura)"/>
<path id="hood" d="M256 100 C178 100 136 168 136 250 C136 300 146 332 158 352 C116 372 76 404 56 512 L456 512 C436 404 396 372 354 352 C366 332 376 300 376 250 C376 168 334 100 256 100 Z" fill="#0b0a0c"/>
<path d="M256 100 C178 100 136 168 136 250 C136 300 146 332 158 352 C116 372 76 404 56 512 L456 512 C436 404 396 372 354 352 C366 332 376 300 376 250 C376 168 334 100 256 100 Z" fill="none" stroke="url(#a-rim)" stroke-width="3"/>
<path id="face" d="M256 172 C208 172 188 214 190 260 C192 306 224 338 256 344 C288 338 320 306 322 260 C324 214 304 172 256 172 Z" fill="#000"/>
<g id="eyes" filter="url(#a-glow)">
<path d="M204 254 Q226 238 246 258 Q224 266 204 254 Z" fill="#ff2b2b"/>
<path d="M308 254 Q286 238 266 258 Q288 266 308 254 Z" fill="#ff2b2b"/>
</g>
<circle cx="229" cy="255" r="2.6" fill="#ffe3e3"/>
<circle cx="283" cy="255" r="2.6" fill="#ffe3e3"/>
<g id="crosshair" stroke="#e9e4e4" stroke-opacity="0.6" fill="none" stroke-linecap="round">
<circle cx="256" cy="256" r="214" stroke-width="4"/>
<circle cx="256" cy="256" r="196" stroke-width="1.5" stroke-opacity="0.3"/>
<line x1="256" y1="42" x2="256" y2="118" stroke-width="3"/>
<line x1="256" y1="394" x2="256" y2="470" stroke-width="3"/>
<line x1="42" y1="256" x2="118" y2="256" stroke-width="3"/>
<line x1="394" y1="256" x2="470" y2="256" stroke-width="3"/>
<line x1="246" y1="140" x2="266" y2="140" stroke-width="2"/>
<line x1="246" y1="372" x2="266" y2="372" stroke-width="2"/>
<line x1="140" y1="246" x2="140" y2="266" stroke-width="2"/>
<line x1="372" y1="246" x2="372" y2="266" stroke-width="2"/>
</g>
<!-- /layer:artwork -->
<!-- layer:overlay -->
<rect width="512" height="512" fill="url(#a-scan)"/>
<rect width="512" height="512" fill="url(#a-vig)"/>
<!-- /layer:overlay -->
</svg>
