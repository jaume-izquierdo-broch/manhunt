name: manhunt

# Development:      pnpm docker:up       -> Postgres + Redis (run the API locally with `pnpm dev`)
# Everything in Docker: pnpm docker:up:all -> also builds and starts the API ("prod" profile)
#
# Variables come from ./.env (copy .env.example). The defaults are for
# development ONLY: on a real server, define all of them in .env.

services:
  postgres:
    image: postgres:17-alpine
    container_name: manhunt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-manhunt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manhunt_secret}
      POSTGRES_DB: ${DB_NAME:-manhunt_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - manhunt_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: manhunt_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - manhunt_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}

  api:
    profiles: ["prod"]
    image: ${API_IMAGE:-manhunt-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: manhunt_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-manhunt}:${DB_PASSWORD:-manhunt_secret}@postgres:5432/${DB_NAME:-manhunt_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - manhunt_net

volumes:
  postgres_data:
  redis_data:

networks:
  manhunt_net:
    driver: bridge
