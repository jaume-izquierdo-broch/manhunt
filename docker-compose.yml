name: manhunt

# Desarrollo:   pnpm docker:up          -> Postgres + Redis (la API corre en local con `pnpm dev`)
# Todo en Docker: pnpm docker:up:all    -> además construye y arranca la API (perfil "prod")
#
# Las variables se leen de ./.env (copia .env.example). Los valores por defecto
# son SOLO para desarrollo: en un servidor real define todas en el .env.

services:
  postgres:
    image: postgres:17-alpine
    container_name: manhunt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-manhunt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manhunt_secret}
      POSTGRES_DB: ${DB_NAME:-manhunt_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - manhunt_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: manhunt_redis
    restart: unless-stopped
    # noeviction: BullMQ necesita que Redis no borre claves por falta de memoria.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - manhunt_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}

  api:
    profiles: ["prod"]
    image: ${API_IMAGE:-manhunt-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: manhunt_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-manhunt}:${DB_PASSWORD:-manhunt_secret}@postgres:5432/${DB_NAME:-manhunt_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_please_32chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - manhunt_net

volumes:
  postgres_data:
  redis_data:

networks:
  manhunt_net:
    driver: bridge
